services:
  coolify:
    image: ghcr.io/coollabsio/coolify:latest
    container_name: coolify
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${APP_PORT:-8000}:8080"
    volumes:
      - ./.env:/var/www/html/.env
      - ./data/ssh:/var/www/html/storage/app/ssh
      - ./data/applications:/var/www/html/storage/app/applications
      - ./data/databases:/var/www/html/storage/app/databases
      - ./data/backups:/var/www/html/storage/app/backups
      - ./data/services:/var/www/html/storage/app/services
      - ./data/proxy:/var/www/html/storage/app/proxy
      - ./data/webhooks-during-maintenance:/var/www/html/storage/app/webhooks-during-maintenance
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-coolify}
      DB_USERNAME: ${DB_USERNAME:-coolify}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      PUSHER_HOST: ${PUSHER_HOST:-soketi}
      PUSHER_PORT: ${PUSHER_PORT:-6001}
      PUSHER_APP_ID: ${PUSHER_APP_ID}
      PUSHER_APP_KEY: ${PUSHER_APP_KEY}
      PUSHER_APP_SECRET: ${PUSHER_APP_SECRET}
    depends_on:
      soketi:
        condition: service_healthy
    networks:
      - coolify
      - postgres
      - redis

  soketi:
    image: ghcr.io/coollabsio/coolify-realtime:latest
    container_name: coolify-realtime
    restart: unless-stopped
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${SOKETI_PORT:-6001}:6001"
      - "${APP_BIND_HOST:-127.0.0.1}:${SOKETI_TERMINAL_PORT:-6002}:6002"
    volumes:
      - ./data/ssh:/var/www/html/storage/app/ssh
    environment:
      APP_NAME: ${APP_NAME:-Coolify}
      SOKETI_DEBUG: ${SOKETI_DEBUG:-false}
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID}
      SOKETI_DEFAULT_APP_KEY: ${PUSHER_APP_KEY}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_APP_SECRET}
      SOKETI_HOST: ${SOKETI_HOST:-0.0.0.0}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=3", "--spider", "http://localhost:6001/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - coolify

networks:
  coolify:
    name: coolify
    driver: bridge
  postgres:
    external: true
  redis:
    external: true
