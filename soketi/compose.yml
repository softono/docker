services:
  soketi:
    image: quay.io/soketi/soketi:latest-16-alpine
    container_name: soketi
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${SOKETI_BIND_HOST:-127.0.0.1}:${SOKETI_PORT:-6001}:6001"
      - "${SOKETI_BIND_HOST:-127.0.0.1}:${SOKETI_METRICS_PORT:-9601}:9601"
    environment:
      SOKETI_DEBUG: ${SOKETI_DEBUG:-0}
      SOKETI_PORT: 6001
      SOKETI_METRICS_ENABLED: ${SOKETI_METRICS_ENABLED:-1}
      SOKETI_METRICS_SERVER_PORT: 9601
      SOKETI_DEFAULT_APP_ID: ${SOKETI_DEFAULT_APP_ID}
      SOKETI_DEFAULT_APP_KEY: ${SOKETI_DEFAULT_APP_KEY}
      SOKETI_DEFAULT_APP_SECRET: ${SOKETI_DEFAULT_APP_SECRET}
    networks:
      - soketi

networks:
  soketi:
    name: soketi
