services:
  9router:
    image: decolua/9router:latest
    container_name: 9router
    restart: unless-stopped

    ports:
      - "127.0.0.1:20120:20120"

    volumes:
      - ./data:/app/data

    env_file:
      - .env

    environment:
      DATA_DIR: /app/data
      PORT: "20120"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production